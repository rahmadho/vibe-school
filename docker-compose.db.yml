# Override: jalankan PostgreSQL DI DALAM stack yang sama.
#
# Versi sebelumnya hanya menambah service `postgres` tanpa menyiapkan apa pun
# yang dibutuhkan aplikasi ini. Itu gagal karena:
#   * `POSTGRES_USER` di image resmi menjadi SUPERUSER dan PEMILIK tabel.
#     Aplikasi justru WAJIB konek sebagai role NON-OWNER, kalau tidak RLS
#     dilewati diam-diam (owner bypass policy).
#   * Nama databasenya `school`, sedangkan `DATABASE_URL` menunjuk
#     `vibe-schools`. Container web akan gagal konek di percobaan pertama.
#   * Schema `app` belum ada, padahal `DATABASE_URL` memakai `?schema=app`.
#
# Berkas ini sekarang membuat DB dan DUA role sekaligus lewat initdb, sehingga
# tidak ada langkah SQL manual. Urutannya: buat schema -> buat role aplikasi
# -> serahkan ke bootstrap.sh (migrasi, tata letak, view, GRANT).
#
# Pemakaian (lihat docs/panduan-deploy-docker.md):
#   docker compose up -d --build
#
# Override ini diaktifkan dari `.env` lewat COMPOSE_FILE, bukan flag `-f`,
# supaya perintah `docker compose up` polos sudah menjalankan stack lengkap.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # Role ini SUPERUSER + pemilik tabel. Hanya dipakai bootstrap.
      POSTGRES_USER: "${POSTGRES_USER:-school}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib diisi}"
      POSTGRES_DB: "${POSTGRES_DB:-vibe-schools}"
      # Role aplikasi (non-owner). Dipakai isi DATABASE_URL.
      APP_DB_ROLE: "${APP_DB_ROLE:-vibe}"
      APP_DB_PASSWORD: "${APP_DB_PASSWORD:?APP_DB_PASSWORD wajib diisi}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Skrip initdb: dijalankan Postgres SEKALI, saat volume masih kosong.
      - ./deploy/postgres-init:/docker-entrypoint-initdb.d:ro
    expose:
      - "5432"
    healthcheck:
      # `-d` eksplisit: tanpa itu pg_isready memakai nama user sebagai DB dan
      # healthcheck gagal walau server sudah siap.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    # Bootstrap baru boleh jalan setelah Postgres benar-benar menerima koneksi.
    # Tanpa ini web start lebih dulu dan `wait for database` menghabiskan
    # waktu tunggunya.
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Menimpa nilai dari compose utama. Host = nama service `postgres`,
      # user = role NON-OWNER. `sslmode=disable` benar di sini: trafiknya
      # tidak pernah keluar dari network internal Docker.
      DATABASE_URL: "postgresql://${APP_DB_ROLE:-vibe}:${APP_DB_PASSWORD:?APP_DB_PASSWORD wajib diisi}@postgres:5432/${POSTGRES_DB:-vibe-schools}?schema=app&sslmode=disable"
      APP_DB_ROLE: "${APP_DB_ROLE:-vibe}"

  wa-gateway:
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://${APP_DB_ROLE:-vibe}:${APP_DB_PASSWORD:?APP_DB_PASSWORD wajib diisi}@postgres:5432/${POSTGRES_DB:-vibe-schools}?schema=app&sslmode=disable"

volumes:
  postgres_data:
