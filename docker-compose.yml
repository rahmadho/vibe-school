# Docker Compose — aplikasi (web) + WA gateway.
#
# Berkas ini sengaja DIBUAT GENERAL: satu berkas yang sama dipakai di VPS
# manual maupun di panel (Coolify/Dokploy/dsb). Karena itu tidak ada yang
# ditambal khusus panel:
#   * TIDAK ada `container_name`  -> nama container jadi <project>-web-1.
#     `container_name` bersifat GLOBAL per daemon; di server yang menjalankan
#     lebih dari satu stack, nama seperti `school-web` pasti bentrok.
#   * TIDAK ada `ports:` publish  -> cukup `expose:`. Publish port adalah
#     sumber error "port is already allocated" saat ada dua stack/panel yang
#     berebut 3000. Reverse proxy / panel masuk lewat app-network.
#   * TIDAK ada `image:` tag tetap -> Compose memberi nama project-scoped.
#     Tag `school-app-web:latest` yang ditulis eksplisit membuat Compose
#     mencoba PULL dari registry ("pull access denied") padahal image hanya
#     dibangun lokal.
#   * Tidak ada label khusus panel; Coolify mendeteksi compose biasa.
#
# TIGA MODE PAKAI
# ---------------
# 1) VPS manual (DB eksternal / remote):
#       cp .env.docker.example .env      # isi nilainya
#       docker compose up -d --build
#    Network dibuat otomatis. Bila DB ada di container lain, sambungkan
#    container itu sekali: docker network connect school-app_app-network <db>
#    (nama network ikut `name:` project, jadi cek dengan `docker network ls`).
#
# 2) Coolify (atau panel lain): buat resource "Docker Compose" dari repo ini,
#    lalu isi environment lewat panel — JANGAN lewat .env (berkas .env tidak
#    ikut ter-commit dan bisa tidak ada di server panel). `env_file` di bawah
#    bersifat OPSIONAL sehingga compose tetap valid walau .env tidak ada.
#    Set domain aplikasi ke port 3000 di panel.
#
# 3) DB ikut compose (dev / self-host skala kecil): pakai berkas override
#       docker compose -f docker-compose.yml -f docker-compose.db.yml \
#                      --profile db up -d --build
#    Saat mode ini dipakai, host di DATABASE_URL = `postgres`
#    (postgresql://vibe:***@HOST_DB:5432/vibe-schools?schema=app&sslmode=require).
#    Untuk produksi sungguhan tetap disarankan DB terkelola/terpisah.
#
# PostgreSQL dan Nginx TIDAK didefinisikan di sini:
#   * PostgreSQL berjalan di stack lain (atau di host remote) dan dijangkau
#     lewat jaringan internal stack ini.
#   * Reverse proxy (Nginx manual / Coolify) menyambungkan dirinya sendiri ke
#     container `web`; kita tidak perlu menyediakan apa pun untuk itu.
#
# TENTANG NETWORK
# ---------------
# Kedua service cukup berbagi SATU network internal milik project ini. Itu
# sudah cukup untuk: web menjangkau wa-gateway lewat nama service, dan keduanya
# menjangkau PostgreSQL.
#
# Kalau PostgreSQL ada di stack/container LAIN, cukup sambungkan container itu
# ke network ini SEKALI di sisi server:
#     docker network connect school-app_default <nama-container-db>
# Network-nya TIDAK boleh dideklarasikan `external: true` di sini: di panel
# seperti Coolify nama network dibuat otomatis (per project/UUID), sehingga
# `external: true` membuat deploy mati dengan
# "network school-db declared as external, but could not be found".
#
# Nama project Compose dipatok `school-app` agar prefix resource
# (`school-app_*`) konsisten dan tidak mengikuti nama folder. Override bila
# perlu: docker compose -p nama-lain ...
name: school-app

services:
  # ------------------------------------------------------------------
  # Aplikasi web (Next.js standalone)
  # ------------------------------------------------------------------
  web:
    build:
      # Konteks = root monorepo, karena npm workspaces + prisma/schema.prisma
      # ada di apps/web dan lockfile di root.
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    env_file:
      # Long syntax + required:false (Compose >= 2.24). Panel seperti Coolify
      # menyuntik env langsung ke container, bukan dari berkas ini — kalau
      # `required` dibiarkan true, deploy di panel gagal karena ".env not found".
      - path: .env
        required: false
    environment:
      NODE_ENV: "${NODE_ENV:-production}"
      PORT: "3000"
      # Nilai diambil dari env (panel/.env) bila ada, kalau tidak pakai default.
      # Sengaja diberi default agar `docker compose config` tetap valid tanpa
      # .env sama sekali — bukan berarti aman dijalankan tanpa rahasia asli.
      DATABASE_URL: "${DATABASE_URL:-postgresql://vibe:***@HOST_DB:5432/vibe-schools?schema=app&sslmode=require}"
      NEXTAUTH_URL: "${NEXTAUTH_URL:-http://localhost:3000}"
      NEXTAUTH_SECRET: "${NEXTAUTH_SECRET:-}"
      ROOT_DOMAIN: "${ROOT_DOMAIN:-localhost}"
      PAYMENT_ENCRYPTION_KEY: "${PAYMENT_ENCRYPTION_KEY:-}"
      # Alamat wa-gateway dari sudut pandang web (nama service Docker).
      WA_GATEWAY_URL: "${WA_GATEWAY_URL:-http://wa-gateway:3001}"
      WA_GATEWAY_TOKEN: "${WA_GATEWAY_TOKEN:-}"
      # Berkas unggahan runtime disimpan di volume agar bertahan saat redeploy.
      STORAGE_DRIVER: "${STORAGE_DRIVER:-local}"
      UPLOAD_DIR: "${UPLOAD_DIR:-/data/uploads}"
    volumes:
      - school_uploads:/data/uploads
    expose:
      # Tidak dipublish ke host. Dijangkau reverse proxy / panel di network ini.
      - "3000"
    networks:
      - app-network
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ------------------------------------------------------------------
  # WA gateway (Baileys): worker antrean + HTTP API sesi
  # ------------------------------------------------------------------
  wa-gateway:
    build:
      context: .
      dockerfile: apps/wa-gateway/Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: "${NODE_ENV:-production}"
      PORT: "3001"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      DATABASE_URL: "${DATABASE_URL:-postgresql://vibe:***@HOST_DB:5432/vibe-schools?schema=app&sslmode=require}"
      # Token HARUS sama dengan yang dipakai web; keduanya membaca var yang sama.
      WA_GATEWAY_TOKEN: "${WA_GATEWAY_TOKEN:-}"
      # Direktori sesi Baileys di dalam container (volume school_wa_sessions).
      WA_SESSION_DIR: "${WA_SESSION_DIR:-/data/sessions}"
    volumes:
      # Kredensial sesi WhatsApp — sangat sensitif, jangan hilang saat redeploy.
      - school_wa_sessions:/data/sessions
    expose:
      # Tidak dipublish. Web memanggilnya lewat nama service di network ini.
      - "3001"
    networks:
      - app-network
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  # Satu network internal, dibuat & dinamai otomatis oleh Compose
  # (`school-app_app-network`). Kedua service ada di sini, jadi `web` bisa
  # menjangkau `wa-gateway` lewat nama service.
  #
  # TIDAK memakai `external: true` dengan sengaja:
  #   * Di manual: network dibuat otomatis, tidak perlu langkah persiapan.
  #   * Di Coolify: network eksternal bernama tetap TIDAK ADA — panel membuat
  #     network per project/UUID. `external: true` di sini adalah penyebab
  #     langsung error "network ... declared as external, but could not be found".
  #   * Kalau DB berada di container lain, sambungkan container DB ke network
  #     ini sekali di sisi server (lihat catatan di bagian atas berkas).
  #
  # `name:` DIHAPUS dengan sengaja. Menulis `name: ${APP_NETWORK:-...}` tidak
  # salah secara sintaks, tetapi membuat network tidak lagi ter-scope project:
  # dua stack di server yang sama akan berebut satu name dan saling menimpa
  # saat salah satunya di-`down`.
  app-network:
    driver: bridge

volumes:
  # Berkas unggahan runtime (logo sekolah, sampul). WAJIB ikut rutin backup —
  # tidak tercakup pg_dump.
  school_uploads:
  # Kredensial sesi WhatsApp, agar tidak perlu pindai QR tiap restart.
  school_wa_sessions:
