services:
  postgres:
    image: postgres:16-alpine
    container_name: school-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: school
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib diatur di .env}
      POSTGRES_DB: schoolapp
    ports:
      - "5432:5432"
    volumes:
      - school_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U school -d schoolapp"]
      interval: 10s
      timeout: 5s
      retries: 5

  wa-gateway:
    build:
      context: ./apps/wa-gateway
      dockerfile: Dockerfile
    container_name: school-wa-gateway
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://school:${POSTGRES_PASSWORD}@postgres:5432/schoolapp?schema=public"
      WA_GATEWAY_TOKEN: "${WA_GATEWAY_TOKEN}"
      WA_SESSION_DIR: "/data/sessions"
      PORT: "3001"
      LOG_LEVEL: "info"
    ports:
      # Hanya mendengarkan di localhost VPS; Nginx yang meneruskan.
      # Jangan diubah ke 0.0.0.0 kecuali Anda tahu konsekuensinya.
      - "127.0.0.1:3001:3001"
    volumes:
      - school_wa_sessions:/data/sessions
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  school_pgdata:
  school_wa_sessions:
