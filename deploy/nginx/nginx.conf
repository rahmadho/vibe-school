# ============================================================
# nginx.conf — konfigurasi utama Nginx untuk School App
#
# Dipakai oleh container Nginx reverse proxy yang berjalan di network
# `app-network` (network yang sama dengan service `web` di docker-compose.yml).
#
# Cara pakai (pindahkan ke container Nginx Anda):
#   * Salin file ini        -> /etc/nginx/nginx.conf
#   * Salin conf.d/*.conf   -> /etc/nginx/conf.d/
#   * Salin snippets/*.conf -> /etc/nginx/snippets/   (bila memakai versi ini)
#
# Atau mount saat menjalankan container Nginx:
#   docker run -d --name nginx \
#     --network app-network \
#     -p 80:80 -p 443:443 \
#     -v $PWD/deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro \
#     -v $PWD/deploy/nginx/conf.d:/etc/nginx/conf.d:ro \
#     -v /etc/letsencrypt:/etc/letsencrypt:ro \
#     nginx:1.27-alpine
#
# Catatan: `proxy_pass http://web:3000` memakai NAMA SERVICE `web` di
# docker-compose.yml. Jika container Nginx dan service web berada di network
# yang sama (`app-network`), resolusi nama ini otomatis bekerja.
# ============================================================

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Format log yang mencatat host asli (penting untuk tenant multi-sekolah):
    # kita ingin tahu SUBDOMAIN mana yang diakses tiap request.
    log_format  school  '$remote_addr - $host [$time_local] '
                        '"$request" $status $body_bytes_sent '
                        '"$http_referer" "$http_user_agent"';

    access_log  /var/log/nginx/access.log  school;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # Header versi Nginx disembunyikan (mengurangi informasi ke penyerang).
    server_tokens   off;

    # Kompresi untuk aset teks — menghemat bandwidth halaman sekolah.
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/json application/javascript
                      text/javascript application/xml+rss image/svg+xml;

    # Batas ukuran badan request global (unggahan logo, dokumen SPMB). Bisa
    # diperkecil/diperbesar per server block di conf.d.
    client_max_body_size  12M;

    # Map untuk header `Connection` pada upgrade WebSocket/SSE. Wajib ada agar
    # `proxy_set_header Connection $connection_upgrade;` di server block valid:
    # bernilai "upgrade" saat klien meminta upgrade, "close" sebaliknya.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Sertakan seluruh server block (portal + wildcard sekolah + custom domain).
    include /etc/nginx/conf.d/*.conf;
}
