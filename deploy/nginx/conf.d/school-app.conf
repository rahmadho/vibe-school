# ============================================================
# school-app.conf — server block School App (multi-tenant subdomain)
#
# GANTI semua "sekolah.id" dengan domain akar Anda, lalu sesuaikan path
# sertifikat Let's Encrypt di /etc/letsencrypt/live/<domain>/.
#
# Arsitektur: satu aplikasi Next.js melayani BANYAK sekolah. Nginx meneruskan
# header `Host` apa adanya, dan aplikasi memutuskan sekolah mana yang tampil
# berdasarkan subdomain (lihat lib/site-host.ts). Karena itu wildcard
# (`*.sekolah.id`) menuju SATU upstream yang sama: service `web` di port 3000.
#
# Aturan penting: header Host TIDAK BOLEH ditimpa. Bila Nginx mengirim
# `Host: localhost`, semua sekolah akan tampil sebagai portal.
# ============================================================

# Upstream dibuat sebagai grup agar mudah diganti (dan siap bila nanti
# menambah replika web). Nama `web` = nama service di docker-compose.yml.
upstream school_app {
    server web:3000;
    keepalive 32;
}

# ------------------------------------------------------------
# 1) Catch-all default (akses lewat IP mentah atau host tak dikenal).
#    Tujuannya: jangan biarkan aplikasi menebak tenant dari host aneh.
#    Kita tolak dengan 421 supaya tidak ada yang "nyasar" ke sekolah tertentu.
# ------------------------------------------------------------
server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name _;

    # Tetap layani verifikasi ACME HTTP-01 bila dipakai (mis. custom domain).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 421;
    }
}

# ------------------------------------------------------------
# 2) HTTP -> HTTPS (domain akar + semua subdomain sekolah).
# ------------------------------------------------------------
server {
    listen      80;
    listen      [::]:80;
    # Titik di depan `sekolah.id` = cocokkan domain akar DAN semua
    # subdomainsatu-tingkat (smpn1.sekolah.id, tkit.sekolah.id, …).
    server_name sd.bakoding.my.id smp.bakoding.my.id sma.bakoding.my.id smk.bakoding.my.id;

    # Endpoint challenge Let's Encrypt harus tetap HTTP & tidak di-redirect.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------
# 3) HTTPS — portal + web sekolah (wildcard).
# ------------------------------------------------------------
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name .sekolah.id;

    # ---- Sertifikat wildcard (WAJIB wildcard, bukan per-subdomain) ----
    # ssl_certificate     /etc/letsencrypt/live/sekolah.id/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/sekolah.id/privkey.pem;
    # Parameter TLS bawaan certbot (bila tersedia). Bila berkas ini tidak ada,
    # komentari dua baris `include`/`ssl_dhparam` di bawah.
    # include     /etc/letsencrypt/options-ssl-nginx.conf;
    #ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Ukuran maksimal unggahan (logo sekolah, dokumen SPMB).
    client_max_body_size 12M;

    # ----------------------------------------------------------------
    # HEADER TENANT — bagian paling mudah salah. Jangan diubah.
    # `Host` diteruskan apa adanya agar aplikasi tahu sekolah mana diminta.
    # ----------------------------------------------------------------
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Beberapa proxy di depan menimpa Host; kirim eksplisit sebagai cadangan.
    proxy_set_header X-Forwarded-Host  $host;

    # Timeout & buffer proxy.
    proxy_http_version 1.1;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_connect_timeout 10s;

    # ----------------------------------------------------------------
    # Aset statis Next.js (_next/static) bersifat immutable & bercache.
    # Melayani langsung dari proxy (bukan lewat Node) menghemat CPU app.
    # ----------------------------------------------------------------
    location /_next/static/ {
        proxy_pass http://school_app;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ----------------------------------------------------------------
    # Endpoint health aplikasi — jangan di-cache, jangan dipublikasikan
    # lewat cache CDN apa pun.
    # ----------------------------------------------------------------
    location = /api/health {
        proxy_pass http://school_app;
        add_header Cache-Control "no-store";
        access_log off;
    }

    # ----------------------------------------------------------------
    # Semua request lain -> aplikasi Next.js.
    # ----------------------------------------------------------------
    location / {
        proxy_pass http://school_app;
        # Upgrade header diperlukan untuk WebSocket / Server-Sent Events.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

